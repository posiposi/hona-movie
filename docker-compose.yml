services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      DB_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?parseTime=true&loc=UTC"
      TEST_DB_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}_test?parseTime=true&loc=UTC"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.10
    # DATETIME は TZ 変換されないため、CURRENT_TIMESTAMP 既定値も UTC で入るよう
    # サーバの time_zone を固定する（「DB には常に UTC を入れる」運用規約の担保）。
    command: --default-time-zone=+00:00
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
  go-mod-cache:
